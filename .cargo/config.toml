# Cross-compilation linkers.
#
# The Windows GNU target is the only Windows target buildable from a
# non-Windows host; `x86_64-pc-windows-msvc` needs the MSVC toolchain and is
# built natively by .github/workflows/release.yml. Requires mingw-w64:
#
#   rustup target add x86_64-pc-windows-gnu
#   sudo apt install gcc-mingw-w64-x86-64      # Debian/Ubuntu
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-gcc-ar"
