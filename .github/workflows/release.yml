name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  # ci.yml guards main, but nothing forces a tag to point at a commit that
  # went through it. Without this gate, tagging the wrong commit ships it.
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # The gnu ARM binary is linked against the runner's glibc (2.39 on
          # Ubuntu 24.04) and will not start on anything older -- which
          # includes Raspberry Pi OS Bookworm, still the common Pi install at
          # glibc 2.36. musl links statically and runs on every Pi.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          # Static CRT, so the exe starts on a clean Windows. The default msvc
          # build imports VCRUNTIME140.dll, which ships with the VC++
          # redistributable rather than the OS -- a download that greets an
          # unlucky user with a missing-DLL box instead of a converter.
          #
          # Deliberately here and not in .cargo/config.toml: config rustflags
          # reach proc macros on a host build (no --target), and crt-static
          # forbids the dylib crate type proc macros compile to, so serde_derive
          # and clap_derive would fail to build -- breaking plain `cargo build`
          # and ci.yml on Windows. The --target below keeps host and target
          # flags apart, which is what makes this safe.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Empty for every target that sets no rustflags, which is a no-op.
      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # Mirrors the local scripts/build-release.sh layout:
      # dist/<triple>/{htmlmd,htmlmd-server}[.exe] + SHA256SUMS, then a flat
      # archive named htmlmd-<tag>-<triple>.tar.gz (.zip on Windows).
      # On Windows this step runs under Git Bash, where sha256sum and 7z exist.
      - name: Assemble dist and archive
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.target }}"
          tag="${GITHUB_REF_NAME}"
          ext=""
          case "$triple" in *windows*) ext=".exe" ;; esac

          out="dist/${triple}"
          mkdir -p "$out"
          cp "target/${triple}/release/htmlmd${ext}" \
             "target/${triple}/release/htmlmd-server${ext}" \
             "$out/"

          (
            cd "$out"
            if [ "$RUNNER_OS" = "macOS" ]; then
              shasum -a 256 "htmlmd${ext}" "htmlmd-server${ext}" > SHA256SUMS
            else
              sha256sum "htmlmd${ext}" "htmlmd-server${ext}" > SHA256SUMS
            fi
          )

          if [ "$RUNNER_OS" = "Windows" ]; then
            asset="htmlmd-${tag}-${triple}.zip"
            (cd "$out" && 7z a "../../${asset}" "htmlmd${ext}" "htmlmd-server${ext}" SHA256SUMS)
          else
            asset="htmlmd-${tag}-${triple}.tar.gz"
            tar -czf "$asset" -C "$out" htmlmd htmlmd-server SHA256SUMS
          fi
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      # Each leg only stages its archive; one release job below assembles
      # them. Six matrix legs calling action-gh-release concurrently race on
      # create-by-tag, which is how duplicate releases happen.
      - name: Stage archive
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: asset-*
          merge-multiple: true

      # Draft on purpose: nothing is downloadable until the assets and
      # checksums have been eyeballed and the release published by hand.
      # docs/RELEASING.md step 6 is that inspection.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: assets/*
          fail_on_unmatched_files: true

  # Unlike the binaries, an image push cannot be drafted: it is public the
  # moment it lands on ghcr.io. The test gate is the only brake it has.
  docker:
    name: Docker image (linux/amd64, linux/arm64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/htmlmd-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # :latest only for stable tags -- a v0.1.0-rc.1 dry run must not
          # become what `docker pull htmlmd-server` hands out.
          tags: ${{ format('ghcr.io/steamvogue/htmlmd-server:{0}', github.ref_name) }}${{ contains(github.ref_name, '-') && '' || ',ghcr.io/steamvogue/htmlmd-server:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
