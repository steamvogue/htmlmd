name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      # Mirrors the local scripts/build-release.sh layout:
      # dist/<triple>/{htmlmd,htmlmd-server}[.exe] + SHA256SUMS, then a flat
      # archive named htmlmd-<tag>-<triple>.tar.gz (.zip on Windows).
      # On Windows this step runs under Git Bash, where sha256sum and 7z exist.
      - name: Assemble dist and archive
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.target }}"
          tag="${GITHUB_REF_NAME}"
          ext=""
          case "$triple" in *windows*) ext=".exe" ;; esac

          out="dist/${triple}"
          mkdir -p "$out"
          cp "target/${triple}/release/htmlmd${ext}" \
             "target/${triple}/release/htmlmd-server${ext}" \
             "$out/"

          (
            cd "$out"
            if [ "$RUNNER_OS" = "macOS" ]; then
              shasum -a 256 "htmlmd${ext}" "htmlmd-server${ext}" > SHA256SUMS
            else
              sha256sum "htmlmd${ext}" "htmlmd-server${ext}" > SHA256SUMS
            fi
          )

          if [ "$RUNNER_OS" = "Windows" ]; then
            asset="htmlmd-${tag}-${triple}.zip"
            (cd "$out" && 7z a "../../${asset}" "htmlmd${ext}" "htmlmd-server${ext}" SHA256SUMS)
          else
            asset="htmlmd-${tag}-${triple}.tar.gz"
            tar -czf "$asset" -C "$out" htmlmd htmlmd-server SHA256SUMS
          fi
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: ${{ env.ASSET }}

  docker:
    name: Docker image (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/htmlmd-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/steamvogue/htmlmd-server:${{ github.ref_name }}
            ghcr.io/steamvogue/htmlmd-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
