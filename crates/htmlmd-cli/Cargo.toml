[package]
name = "htmlmd-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for htmlmd, the fast HTML to Markdown converter."
readme = "../../README.md"
keywords = ["html", "markdown", "converter", "commonmark", "cli"]
categories = ["command-line-utilities", "text-processing"]

[package.metadata.deb]
maintainer = "htmlmd contributors"
copyright = "2026, htmlmd contributors"
extended-description = """\
  A fast, configurable HTML-to-Markdown converter \
  with multiple output profiles."""
section = "utils"
priority = "optional"

# `cargo binstall htmlmd-cli` fetches the prebuilt archives that
# .github/workflows/release.yml uploads to GitHub Releases.
# Asset naming: htmlmd-v<version>-<target>.tar.gz (zip on Windows),
# containing htmlmd[.exe], htmlmd-server[.exe] and SHA256SUMS at the root.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/htmlmd-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/htmlmd-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "htmlmd"
path = "src/main.rs"

[features]
default = ["parallel", "mimalloc"]
parallel = ["htmlmd-core/parallel", "rayon"]
mimalloc = ["dep:mimalloc"]

[dependencies]
htmlmd-core = { workspace = true }
clap = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
walkdir = { workspace = true }
glob = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
encoding_rs = { workspace = true }
filetime = { workspace = true }
tempfile = { workspace = true }
rayon = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
