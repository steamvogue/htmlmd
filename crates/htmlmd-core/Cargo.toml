[package]
name = "htmlmd-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust library for preparing clean, model-ready Markdown or text from HTML."
readme = "../../README.md"
keywords = ["html", "markdown", "ai", "rag", "converter"]
categories = ["text-processing", "web-programming"]

[features]
default = ["backend-htmd"]
# The pre-M3 htmd-based backend, kept during the native-renderer transition
# for differential parity testing. Disable with --no-default-features for a
# single-engine build.
backend-htmd = ["dep:htmd"]

[dependencies]
htmd = { workspace = true, optional = true }
scraper = { workspace = true }
markup5ever = { workspace = true }
html5ever = { workspace = true }
markup5ever_rcdom = "0.38.0"
ego-tree = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
indexmap = { workspace = true }
unicode-normalization = { workspace = true }
log = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
mimalloc = { workspace = true }
# Benches always need raw htmd as the baseline, independent of backend-htmd.
htmd = { workspace = true }
fast_html2md = "0.0.62"
mdka = "2.1.6"
proptest = "1.11.0"

[[bench]]
name = "convert_bench"
harness = false
