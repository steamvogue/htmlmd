[workspace]
resolver = "3"
members = ["crates/htmlmd-core", "crates/htmlmd-cli", "crates/htmlmd-server"]

[workspace.package]
version = "0.1.0"
authors = ["htmlmd contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/steamvogue/htmlmd"
rust-version = "1.85"

[workspace.dependencies]
htmlmd-core = { path = "crates/htmlmd-core" }

# Core dependencies
htmd = "0.5.4"
scraper = "0.27"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
regex = "1.10"
once_cell = "1.20"
indexmap = { version = "2.7", features = ["serde"] }
markup5ever = "0.39"
html5ever = "0.38"
ego-tree = "0.11"
unicode-normalization = "0.1"
log = "0.4"
rayon = "1.10"

# CLI dependencies
clap = { version = "4.5", features = ["derive", "env", "cargo", "wrap_help"] }
figment = { version = "0.10", features = ["toml", "json", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dirs = "6"
walkdir = "2"
glob = "0.3"
sha2 = "0.10"
similar = "2.7"
encoding_rs = "0.8"
filetime = "0.2"

# Server dependencies
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Allocator (optional, default-on for the binaries)
mimalloc = "0.1"

# Dev dependencies
insta = { version = "1.42", features = ["json", "redactions"] }
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
